aid: veracode
name: Veracode
description: Veracode is an application security testing (AST) platform offering static analysis (SAST),
  dynamic analysis (DAST), software composition analysis (SCA), manual penetration testing, and developer
  security training. The Veracode Platform provides a comprehensive suite of REST APIs enabling organizations
  to automate security testing, access findings, manage policies, generate reports, and administer users
  and teams. All REST APIs use HMAC authentication with API ID/key credentials and return JSON responses
  following OpenAPI standards.
